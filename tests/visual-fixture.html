<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EDU-1205 Capital fixture</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090d0f;color:#dfe5e8;font:13px system-ui}.capital{display:grid;grid-template-rows:48px 1fr;height:100vh}.top{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #293238;background:#101619;font-weight:700}.work{display:grid;grid-template-columns:minmax(300px,1fr) 520px;gap:8px;padding:8px;min-height:0}.chat,.plugin{border:1px solid #293238;background:#0f1518;min-width:0;overflow:auto}.bar{height:35px;padding:9px 12px;border-bottom:1px solid #293238;color:#9da7ac;font:700 10px ui-monospace}.chatmain{display:grid;place-items:center;height:calc(100% - 35px);color:#68757b}.plugin>div{height:calc(100% - 35px)}@media(max-width:760px){.work{grid-template-columns:minmax(190px,1fr) minmax(280px,52vw)}.top{padding-left:10px}}</style></head><body><main class="capital"><div class="top">CAPITAL / COMMAND CENTER</div><div class="work"><section class="chat"><div class="bar">CAPITAL AGENT</div><div class="chatmain">Native chat surface</div></section><section class="plugin"><div class="bar">STUDYLINK RUNTIME STATUS</div><div id="root"></div></section></div></main><script type="module">import{mount}from"../dist/plugin.js";const mode=new URLSearchParams(location.search).get("state")||"idle";let calls=0;const snapshot=await fetch("../fixtures/completed.synthetic.json").then(r=>r.json());mount(document.querySelector("#root"),{invoke:async()=>{calls++;if(mode==="error"||(mode==="recovered"&&calls===1))throw new Error("Local connector unavailable.");if(mode==="stale")return{availability:"stale",snapshot,synthetic:true};return{availability:"idle",snapshot:null,synthetic:false}}});</script></body></html>
